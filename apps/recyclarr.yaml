apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recyclarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
    targetRevision: HEAD
    path: recyclarr/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: home-media-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
