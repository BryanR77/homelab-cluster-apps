apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: apps
  sources:
    - repoURL: https://helm.otwld.com/
      chart: ollama
      targetRevision: 1.95.0
      helm:
        valueFiles:
          - $values/ollama/values.yaml
    - repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
      targetRevision: main
      path: ollama/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
