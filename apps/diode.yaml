apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diode
  namespace: argocd
spec:
  project: apps
  sources:
    - repoURL: https://netboxlabs.github.io/diode/charts
      chart: diode
      targetRevision: 1.15.6
      helm:
        valueFiles:
          - $values/diode/values.yaml
    - repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
      targetRevision: HEAD
      ref: values
    # diode-proxy: namespace-local nginx that replaces the chart's bundled
    # ingress-nginx (routing + auth_request to diode-auth /introspect).
    - repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
      targetRevision: HEAD
      path: diode/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: diode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
