apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myspeed
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
    targetRevision: HEAD
    path: myspeed/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: myspeed
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
