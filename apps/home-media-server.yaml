apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-media-server
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/BryanR77/home-media-server.git
      targetRevision: main
      path: chart
      helm:
        valueFiles:
          - $values/home-media-server/values.yaml
    - repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: home-media-server
  syncPolicy:
    # Plex mounts the virtiofs media share on talos-worker5 via hostPath,
    # which the cluster-default "baseline" Pod Security level forbids.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
