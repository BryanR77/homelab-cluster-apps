apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox-snmp-sync
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/BryanR77/homelab-cluster-apps-values.git
    targetRevision: HEAD
    path: netbox-snmp-sync/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox-snmp-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
