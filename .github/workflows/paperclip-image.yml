name: Build Paperclip Image

# Paperclip (https://github.com/paperclipai/paperclip) has no official
# published container image -- only unofficial third-party ones, which isn't
# an acceptable supply chain for something that will hold LLM provider API
# keys and run agent-driven shell/git commands. This builds the image
# ourselves, straight from upstream's own multi-stage Dockerfile against a
# checkout of their source tree (there's nothing of ours to build; the
# Dockerfile *is* the upstream one), and publishes it to our own GHCR.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paperclip-image.yml
  schedule:
    # The app version below is pinned, so this isn't chasing upstream --
    # it just picks up base image (node:24-trixie-slim) security patches on
    # an otherwise-unchanged release.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "paperclipai/paperclip ref to build (tag, branch, or SHA) -- defaults to the pinned release below"
        required: false

env:
  IMAGE: ghcr.io/bryanr77/paperclip
  UPSTREAM_REPO: paperclipai/paperclip
  # Pinned to a GitHub release rather than floating on master, so builds are
  # reproducible and reviewable. Renovate bumps this line via the custom
  # regex manager in renovate.json, the same way it bumps Helm chart
  # targetRevisions in apps/*.yaml.
  # renovate: datasource=github-releases depName=paperclipai/paperclip
  UPSTREAM_REF: v2026.916.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream paperclip source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || env.UPSTREAM_REF }}
          path: paperclip-src

      # The production target compiles a Rust binary (cargo-chef), builds
      # the full pnpm workspace, and npm-installs several CLI tools globally
      # into the runtime image -- heavier than this repo's other custom
      # builds. Free up the standard runner's preinstalled Android/.NET/etc.
      # toolchains first so multi-stage build layers don't hit disk pressure.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Resolve build metadata
        id: meta
        working-directory: paperclip-src
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: paperclip-src
          # The upstream Dockerfile also defines a `cloud` target (bundles
          # managed-hosting-only sandbox providers/deps) -- explicitly build
          # `production`, the self-hosted target, so we don't silently pick
          # up whatever the default stage ordering happens to be.
          target: production
          push: true
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ env.UPSTREAM_REF }}
            PAPERCLIP_BUILD_COMMIT=${{ steps.meta.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.UPSTREAM_REF }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
