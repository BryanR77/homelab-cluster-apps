name: Build Sketch Lab Image

# Sketch Lab (https://github.com/webdevcody/sketchlab.app) has no published
# container image -- upstream's CI only deploys to their own AWS hosting. This
# builds the image ourselves, straight from upstream's own Dockerfile (a Vite
# build copied into nginx:alpine) against a checkout of their source tree, and
# publishes it to our own GHCR. Same pattern as paperclip-image.yml.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sketchlab-image.yml
  schedule:
    # The app commit below is pinned, so this isn't chasing upstream -- it
    # just picks up base image (nginx:alpine) security patches on an
    # otherwise-unchanged commit.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "webdevcody/sketchlab.app ref to build (branch or SHA) -- defaults to the pinned commit below"
        required: false

env:
  IMAGE: ghcr.io/bryanr77/sketchlab
  UPSTREAM_REPO: webdevcody/sketchlab.app
  # Upstream publishes no releases or tags, so this is pinned to a commit on
  # main rather than floating on it. Renovate bumps this digest via the
  # git-refs regex manager in renovate.json. After a bump, update the image
  # tag in homelab-cluster-apps-values/sketchlab/manifests/deployment.yaml
  # to the new short SHA.
  # renovate: datasource=git-refs depName=https://github.com/webdevcody/sketchlab.app branch=main
  UPSTREAM_REF: 8154cac8a7d57c211f56bbe1123ee9e7db5848e8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream sketchlab source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || env.UPSTREAM_REF }}
          path: sketchlab-src

      - name: Resolve build metadata
        id: meta
        working-directory: sketchlab-src
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sketchlab-src
          push: true
          # Force a fresh base image pull so the weekly run actually picks up
          # nginx:alpine patches instead of reusing a cached base layer.
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
